[package]
name = "toranja-overlay"
version = "0.1.0"
description = "Toranja Overlay — Chat transparente sobre o jogo para Windows 10/11"
authors = ["Toranja Tech"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "toranja_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp"] }
winreg = "0.56"
